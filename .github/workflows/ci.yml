# Lint, typecheck and test on every push and pull request. No AWS: this is
# the check `main` requires before a merge, and it runs for forks too.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      # The SST platform types (`aws`, `$app`, ...) that sst.config.ts and
      # infra/ typecheck against. Downloads only; no AWS credentials.
      - run: bun sst install
      - run: bun run check:ci
      - run: bun run typecheck
      - run: bun run test

