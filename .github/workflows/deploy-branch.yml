# Push to a branch listed under `stages` in sst.settings.json and it deploys
# to that stage: `main` to production, `staging` to staging, a developer's
# branch to their own stage. Any other branch stops at the lookup.
name: deploy branch

on:
  push:
    branches: ["**"]
    # Docs-only changes deploy nothing.
    paths-ignore:
      - "**.md"
      - "LICENSE"

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      stage: ${{ steps.map.outputs.stage }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: sst.settings.json
          sparse-checkout-cone-mode: false
      - id: map
        run: |
          stage=$(jq -r --arg branch "$GITHUB_REF_NAME" '.stages[$branch] // empty' sst.settings.json)
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          echo "branch $GITHUB_REF_NAME -> stage ${stage:-none}"

  deploy:
    needs: resolve
    if: needs.resolve.outputs.stage != ''
    # A called workflow can only use what its caller grants.
    permissions:
      id-token: write
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      stage: ${{ needs.resolve.outputs.stage }}
      environment: ${{ needs.resolve.outputs.stage == 'production' && 'production' || 'preview' }}

  # Only the specs tagged @smoke: they never write, so they are safe against
  # production and any developer's stage.
  smoke:
    needs: [resolve, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e -- --grep @smoke
        working-directory: apps/web
        env:
          CI: "true"
          E2E_BASE_URL: ${{ needs.deploy.outputs.web_url }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ needs.resolve.outputs.stage }}
          path: apps/web/playwright-report
          retention-days: 7
