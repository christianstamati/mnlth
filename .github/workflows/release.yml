# Every push to main updates the release pull request: `changeset version`
# consumes the files in .changeset/, bumps the version in
# apps/web/package.json, and writes apps/web/CHANGELOG.md. Merging that PR
# is a push to main with no changesets left, which is when the `tag` step
# tags `web@<version>`, publishes the GitHub Release from the changelog
# section, and posts it to Slack. That merge deploys production as any
# other push.
#
# Tagging is done here, not by `changeset publish`: for private packages
# the action never sees npm's "New tag" lines, so it would create the tag
# on the runner and push nothing. The step is idempotent: a version whose
# tag already exists is skipped.
#
# The release PR is opened with the workflow token, and GitHub runs no
# workflows on pushes made with it, so the required `check` never starts.
# Close and reopen the PR (or push to it) to trigger CI before merging.
#
# The Slack post lives here rather than on a `release` event for the same
# reason: a release created with the workflow token triggers nothing.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      published: ${{ steps.tag.outputs.published }}
      tag: ${{ steps.tag.outputs.tag }}
      url: ${{ steps.tag.outputs.url }}
      body: ${{ steps.tag.outputs.body }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile

      - uses: changesets/action@v1
        id: changesets
        with:
          version: bun run version
          title: "chore: release"
          commit: "chore: release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: tag and release
        id: tag
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(jq -r .version apps/web/package.json)
          tag="web@$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag already exists; nothing to release"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The changelog section for this version: from its heading to the next.
          notes=$(awk -v v="## $version" '
            $0 == v { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' apps/web/CHANGELOG.md)
          git tag "$tag"
          git push origin "$tag"
          url=$(gh release create "$tag" --title "$tag" --notes "$notes")
          {
            echo "published=true"
            echo "tag=$tag"
            echo "url=$url"
            echo "body<<BODY_EOF"
            printf '%s\n' "$notes"
            echo "BODY_EOF"
          } >> "$GITHUB_OUTPUT"

  slack:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts/release-slack.sh
          sparse-checkout-cone-mode: false
      - run: bash scripts/release-slack.sh
        env:
          REPO: ${{ github.event.repository.name }}
          TAG: ${{ needs.release.outputs.tag }}
          URL: ${{ needs.release.outputs.url }}
          BODY: ${{ needs.release.outputs.body }}
          WEBHOOK: ${{ secrets.SLACK_RELEASES_WEBHOOK }}
