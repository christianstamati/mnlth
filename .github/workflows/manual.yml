# Run one SST command against any stage from the Actions tab: a deploy of a
# stage no branch maps to, a removal, `unlock` after a job died mid-deploy,
# or `refresh` after something was changed by hand in AWS.
name: manual

on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        required: true
        options: [deploy, remove, unlock, refresh]
      stage:
        type: string
        required: true
        description: Stage name, e.g. staging or pr-42. production refuses remove.

permissions:
  id-token: write
  contents: read

concurrency:
  group: sst-${{ inputs.stage }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: sst ${{ inputs.action }}
        run: bun sst "${{ inputs.action }}" --stage "${{ inputs.stage }}"
        env:
          SST_PRINT_LOGS: "1"

      - name: push convex functions
        if: inputs.action == 'deploy'
        run: bun scripts/convex-deploy.ts --stage "${{ inputs.stage }}" --wait
