# The one deploy job. Every other workflow only decides the stage name and
# calls this. Steps: assume the OIDC role, `sst deploy`, push the Convex
# functions, read the outputs back, tell Slack.
name: deploy

on:
  workflow_call:
    inputs:
      stage:
        type: string
        required: true
      environment:
        # The GitHub Environment to record the deployment under: "production"
        # can require a reviewer; everything else is "preview".
        type: string
        required: false
        default: preview
    outputs:
      web_url:
        value: ${{ jobs.deploy.outputs.web_url }}
      convex_url:
        value: ${{ jobs.deploy.outputs.convex_url }}
      convex_dashboard_url:
        value: ${{ jobs.deploy.outputs.convex_dashboard_url }}

permissions:
  id-token: write # OIDC token for the AWS role
  contents: read
  deployments: write

# One deploy per stage at a time. `sst deploy` locks the stage's state file;
# a second deploy of the same stage would fail on that lock, so queue instead.
concurrency:
  group: sst-${{ inputs.stage }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A fresh stage: about ten minutes for the box, then up to fifteen more
    # while it pulls images and mints the admin key.
    timeout-minutes: 45
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.outputs.outputs.web_url }}
    outputs:
      web_url: ${{ steps.outputs.outputs.web_url }}
      convex_url: ${{ steps.outputs.outputs.convex_url }}
      convex_dashboard_url: ${{ steps.outputs.outputs.convex_dashboard_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile

      # Gates before any credentials exist.
      - run: bun run check:ci
      - run: bun run typecheck

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: sst deploy
        run: bun sst deploy --stage "${{ inputs.stage }}"
        env:
          SST_PRINT_LOGS: "1"
          # Sentry: the DSN is baked into the client bundle; the token and
          # org/project upload source maps for this commit. All optional:
          # unset, the app runs without Sentry and the build skips the upload.
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: push convex functions
        run: bun scripts/convex-deploy.ts --stage "${{ inputs.stage }}" --wait

      - name: read outputs
        id: outputs
        run: |
          jq -r '"web_url=\(.webUrl)", "convex_url=\(.convexUrl)", "convex_dashboard_url=\(.convexDashboardUrl)"' .sst/outputs.json \
            | tee -a "$GITHUB_OUTPUT"

  # #deploys: production and staging every time, previews only when they
  # fail. Needs the SLACK_DEPLOYS_WEBHOOK secret; without it the step is
  # skipped, not failed.
  notify:
    needs: deploy
    if: >-
      always() &&
      (inputs.environment == 'production' || inputs.stage == 'staging' || needs.deploy.result != 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: slackapi/slack-github-action@v2
        if: env.WEBHOOK != ''
        env:
          WEBHOOK: ${{ secrets.SLACK_DEPLOYS_WEBHOOK }}
        with:
          webhook: ${{ secrets.SLACK_DEPLOYS_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            text: "${{ needs.deploy.result == 'success' && ':white_check_mark:' || ':x:' }} `${{ inputs.stage }}` ${{ needs.deploy.result }} · ${{ github.actor }} · <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}> · ${{ needs.deploy.outputs.web_url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}"
