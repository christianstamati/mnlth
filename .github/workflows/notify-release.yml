# Post every published GitHub Release to the Slack releases channel. The
# webhook lives in the SLACK_RELEASES_WEBHOOK repository secret.
name: notify release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  slack:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Release notes are GitHub markdown; Slack has its own. Translate the
      # parts release-please emits: headings, bold, bullets, links.
      - name: format notes
        id: notes
        env:
          BODY: ${{ github.event.release.body }}
        run: |
          {
            echo 'text<<NOTES'
            printf '%s\n' "$BODY" \
              | sed -E 's/^#+ +(.*)$/*\1*/; s/\*\*([^*]+)\*\*/*\1*/g; s/^\* /• /; s/\[([^]]+)\]\(([^)]+)\)/<\2|\1>/g'
            echo 'NOTES'
          } >> "$GITHUB_OUTPUT"

      - uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_RELEASES_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            text: "${{ github.event.repository.name }} ${{ github.event.release.tag_name }} released: ${{ github.event.release.html_url }}"
            blocks:
              - type: header
                text:
                  type: plain_text
                  text: "${{ github.event.repository.name }} ${{ github.event.release.tag_name }}"
              - type: section
                text:
                  type: mrkdwn
                  text: ${{ toJSON(steps.notes.outputs.text) }}
              - type: context
                elements:
                  - type: mrkdwn
                    text: "<${{ github.event.release.html_url }}|View on GitHub>"
